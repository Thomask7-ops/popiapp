<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Πρόγραμμα Ιδιαίτερων</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
  <meta name="theme-color" content="#1c3557">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ιδιαίτερα">
</head>
<body>

<div id="app-shell">
  <header class="app-header">
    <div class="header-title">
      <span class="header-icon">📅</span>
      Ιδιαίτερα
      <span id="current-year" class="header-year"></span>
    </div>
    <div class="header-user">
      <span id="user-display" class="user-name"></span>
      <span id="role-badge" class="badge"></span>
    </div>
  </header>

  <div class="app-body">
    <nav class="side-nav">
      <div class="nav-item active" data-route="dashboard" onclick="App.navigate('dashboard')">
        <span class="nav-icon">📊</span> Πίνακας
      </div>
      <div class="nav-item" data-route="calendar" onclick="App.navigate('calendar')">
        <span class="nav-icon">📅</span> Ημερολόγιο
      </div>
      <div class="nav-item" data-route="schedule" onclick="App.navigate('schedule')">
        <span class="nav-icon">🗓</span> Πρόγραμμα
      </div>
      <div class="nav-item" data-route="students" onclick="App.navigate('students')">
        <span class="nav-icon">👥</span> Μαθητές
      </div>
      <div class="nav-item" data-route="payments" onclick="App.navigate('payments')">
        <span class="nav-icon">💶</span> Πληρωμές
      </div>
      <div class="nav-item" data-route="settings" onclick="App.navigate('settings')">
        <span class="nav-icon">⚙️</span> Ρυθμίσεις
      </div>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <nav class="bottom-nav">
    <div class="nav-item active" data-route="dashboard" onclick="App.navigate('dashboard')">
      <div class="nav-icon">📊</div>
      <div class="nav-label">Πίνακας</div>
    </div>
    <div class="nav-item" data-route="calendar" onclick="App.navigate('calendar')">
      <div class="nav-icon">📅</div>
      <div class="nav-label">Ημερολόγιο</div>
    </div>
    <div class="nav-item" data-route="schedule" onclick="App.navigate('schedule')">
      <div class="nav-icon">🗓</div>
      <div class="nav-label">Πρόγραμμα</div>
    </div>
    <div class="nav-item" data-route="students" onclick="App.navigate('students')">
      <div class="nav-icon">👥</div>
      <div class="nav-label">Μαθητές</div>
    </div>
    <div class="nav-item" data-route="payments" onclick="App.navigate('payments')">
      <div class="nav-icon">💶</div>
      <div class="nav-label">Πληρωμές</div>
    </div>
    <div class="nav-item" data-route="settings" onclick="App.navigate('settings')">
      <div class="nav-icon">⚙️</div>
      <div class="nav-label">Ρυθμίσεις</div>
    </div>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>

<!-- Firebase 9 compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- App -->
<script src="js/config.js"></script>
<script src="js/holidays.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>

<!-- PWA service worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>

</body>
</html>
